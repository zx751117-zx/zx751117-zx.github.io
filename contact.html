        <p>以下の情報でお気軽にお問い合わせください。迅速にご対応いたします。</p>
        <div class="contact-details">
          <p><strong>京都本社</strong><br>〒610-1102 京都府京都市西京区御陵大枝山町1-17-12</p>
          <p><strong>東京事務所</strong><br>〒104-0041 東京都中央区新富1-13-24 LMベルコート新富町501室</p>
          <p><strong>電話</strong><br><a href="tel:0752030940">075-203-0940</a></p>
          <p><strong>メール</strong><br><a href="mailto:info@yinchung.com">info@yinchung.com</a></p>
        </div>
      </div>

      <div class="contact-form">
        <form id="contact-form" novalidate="">
          <div class="form-group">
            <label for="name">お名前</label>
            <input type="text" id="name" name="name" placeholder="例：山田 太郎" required="" autocomplete="name">

          <div class="form-group">
            <label for="company">会社名</label>

            <label for="email">メールアドレス</label>
            <input type="email" id="email" name="email" placeholder="example@domain.com" required="" autocomplete="email">

          <div class="form-group">

            <textarea id="message" name="message" rows="8" placeholder="ご相談内容をご記入ください" required=""></textarea>
